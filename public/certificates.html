<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chirag | My Certificates</title>
  <meta name="description" content="Certificates earned by Chirag Varshney in programming and DSA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    :root { --sky:#38bdf8; --blue:#2563eb; --glass:rgba(255,255,255,.07); }

    body { background:radial-gradient(circle at 20% 0%,#0c2340,#020617 60%); color:#fff; min-height:100vh; padding:40px 20px 60px; }

    /* NAV */
    .top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:48px; flex-wrap:wrap; gap:16px; }
    .back-btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 22px; border-radius:30px; text-decoration:none; color:#fff; font-size:.9rem;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); transition:.3s;
    }
    .back-btn:hover { background:rgba(56,189,248,.15); border-color:var(--sky); }
    .page-title { font-size:2rem; font-weight:700; background:linear-gradient(135deg,#fff,var(--sky)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    /* LOADING */
    #certs-loading { text-align:center; padding:60px; opacity:.5; font-size:1.1rem; }
    #certs-error   { text-align:center; padding:40px; color:#ef4444; }

    /* GRID */
    .cert-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:28px; }

    .cert-card {
      background:var(--glass); border:1px solid rgba(255,255,255,.1);
      border-radius:20px; overflow:hidden; cursor:pointer; transition:.35s;
    }
    .cert-card:hover { transform:translateY(-10px); box-shadow:0 12px 40px rgba(56,189,248,.25); border-color:rgba(56,189,248,.4); }

    .cert-img-wrap { width:100%; aspect-ratio:4/3; overflow:hidden; background:#0a1628; }
    .cert-img-wrap img { width:100%; height:100%; object-fit:cover; transition:.4s; }
    .cert-card:hover .cert-img-wrap img { transform:scale(1.06); }

    .cert-info { padding:20px; }
    .cert-info h3 { font-size:1rem; font-weight:600; margin-bottom:4px; }
    .cert-info .cert-meta { font-size:.8rem; opacity:.55; display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .cert-link {
      display:inline-flex; align-items:center; gap:6px; padding:7px 16px;
      border-radius:20px; text-decoration:none; font-size:.8rem; color:var(--sky);
      border:1px solid rgba(56,189,248,.35); transition:.25s;
    }
    .cert-link:hover { background:rgba(56,189,248,.15); }

    /* LIGHTBOX */
    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; justify-content:center; align-items:center; z-index:300; backdrop-filter:blur(6px); }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:90vw; max-height:88vh; border-radius:12px; box-shadow:0 0 60px rgba(56,189,248,.3); animation:popUp .3s ease; }
    .lb-close { position:fixed; top:20px; right:28px; font-size:2rem; cursor:pointer; color:rgba(255,255,255,.7); transition:.2s; }
    .lb-close:hover { color:#fff; }
    @keyframes popUp { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }

    /* Empty state */
    .empty { text-align:center; padding:80px 20px; opacity:.4; }
    .empty .empty-icon { font-size:4rem; margin-bottom:16px; }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="back-btn">← Back to Portfolio</a>
  <h1 class="page-title">My Certificates 📜</h1>
</div>

<div id="certs-loading">⏳ Loading certificates…</div>
<div id="certs-error" style="display:none">⚠️ Could not load certificates.</div>
<div id="cert-grid" class="cert-grid" style="display:none"></div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <img id="lb-img" src="" alt="Certificate">
</div>

<script>
  function imgSrc(cert) {
    // Uploaded certs are in /uploads/, seeded ones are in root
    if (cert.filename.includes('/') || cert.id.startsWith('cert-')) {
      return '/' + encodeURIComponent(cert.filename);
    }
    return '/uploads/' + cert.filename;
  }

  function openLightbox(src) {
    document.getElementById('lb-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });

  async function loadCerts() {
    try {
      const res = await fetch('/api/certificates');
      if (!res.ok) throw new Error();
      const certs = await res.json();

      document.getElementById('certs-loading').style.display = 'none';

      const grid = document.getElementById('cert-grid');
      grid.style.display = 'grid';

      if (!certs.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📭</div><p>No certificates yet.</p></div>`;
        return;
      }

      certs.forEach(cert => {
        // For seeded certs with spaces in filename, handle encoding
        const src = cert.filename.includes(' ')
          ? '/' + cert.filename.split('/').map(encodeURIComponent).join('/')
          : (cert.id.startsWith('cert-') ? '/' + cert.filename : '/uploads/' + cert.filename);

        const card = document.createElement('div');
        card.className = 'cert-card';
        card.innerHTML = `
          <div class="cert-img-wrap" onclick="openLightbox('${src}')">
            <img src="${src}" alt="${cert.title}" loading="lazy">
          </div>
          <div class="cert-info">
            <h3>${cert.title}</h3>
            <div class="cert-meta">
              ${cert.issuer ? `<span>🏛️ ${cert.issuer}</span>` : ''}
              ${cert.date   ? `<span>📅 ${cert.date}</span>`   : ''}
            </div>
            ${cert.link ? `<a href="${cert.link}" target="_blank" class="cert-link">🔗 View Credential</a>` : ''}
          </div>`;
        grid.appendChild(card);
      });
    } catch {
      document.getElementById('certs-loading').style.display = 'none';
      document.getElementById('certs-error').style.display   = 'block';
    }
  }

  loadCerts();
</script>
</body>
</html>
